name: Build Docker Image

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout tag commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify tag belongs to main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "${{ github.sha }}" origin/main
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/envilleplease/weatherpi-v2:latest
            ghcr.io/envilleplease/weatherpi-v2:dev-${{ github.sha }}
            ghcr.io/envilleplease/weatherpi-v2:${{ github.ref_name }}
          platforms: linux/amd64,linux/arm/v7,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
